; UART-MQTT bridge on the Axiometa Genesis Mini (ESP32-S3-MINI-1, N4R2)
; https://docs.platformio.org/page/projectconf.html

; A build or an upload with no environment named is for the board; the unit tests are asked for
; by name
[platformio]
default_envs = genesis-mini

[env:genesis-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; don't let the monitor toggle DTR/RTS - on the ESP32-S3's USB port that can
; hold the chip in reset or in download mode
monitor_dtr = 0
monitor_rts = 0
; the unit tests run on the PC only, never on the board
test_ignore = *

; Genesis Mini has 4 MB flash - the board default is 8 MB
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

; certificates the MQTT client connects with, written by scripts/steps/setup-certs.sh;
; also listed in src/CMakeLists.txt (target_add_binary_data)
board_build.embed_txtfiles =
  include/secrets/ca.crt
  include/secrets/client.crt
  include/secrets/client.key

; Unit tests, built for and run on the PC: pio test -e native
; Only the files listed here are compiled: the application's files, and the stand-ins for what
; only exists on the board (test/README.md)
[env:native]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.1
lib_ldf_mode = off
test_build_src = yes
build_src_filter =
    -<*>
    +<app/status.c>
    +<app/downstream_connection.c>
    +<app/messaging/helpers.c>
    +<app/messaging/line_framing.c>
    +<app/messaging/downstream_messaging.c>
    +<app/messaging/upstream_messaging.c>
    +<app/messaging/message_routing.c>
    +<../test/fakes/fakes.c>
; test/fakes holds the config the tests are built with, and the headers that stand in for
; ESP-IDF's. It is given with -iquote, which is searched before every -I folder: PlatformIO puts
; the project's own include/ first among those, and include/generated/ holds the real config.
; The modules' own headers are used as they are.
build_flags =
    -iquote test/fakes
    -I include/app
    -I include/app/messaging
    -I components/modules/led
    -I components/modules/uart_link
    -I components/modules/wifi_link
    -I components/modules/mqtt_link
